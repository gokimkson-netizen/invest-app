name: daily-kr
# 국내장 마감 후 1회(D10): UTC 09:17 = KST 18:17. 국내 마감 15:30 KST 이후
on:
  schedule:
    - cron: '17 9 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: daily-kr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: 필수 비밀값 확인(DATA_KEY 없으면 여기서 중단)
        env: { DATA_KEY: ${{ secrets.DATA_KEY }} }
        run: |
          if [ -z "$DATA_KEY" ]; then echo "::error::DATA_KEY 비밀값이 없습니다. README '비밀값 등록' 단계를 먼저 하세요."; exit 1; fi
      - name: data 브랜치 확인(없음=첫 실행, 확인 실패=중단)
        id: databr
        run: |
          set +e; git ls-remote --exit-code --heads origin data >/dev/null; rc=$?; set -e
          if [ $rc -eq 0 ]; then echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ $rc -eq 2 ]; then echo "exists=false" >> "$GITHUB_OUTPUT"; echo "data 브랜치 없음 — 첫 실행으로 빈 상태에서 시작"
          else echo "::error::data 브랜치 확인 실패(rc=$rc) — 직전 데이터를 잃지 않도록 중단"; exit 1; fi
      - name: data 브랜치 받기
        if: steps.databr.outputs.exists == 'true'
        uses: actions/checkout@v4
        with: { ref: data, path: _data }
      - name: 이전 상태 복호화
        env: { DATA_KEY: ${{ secrets.DATA_KEY }} }
        run: node batch/calc/dist/cli.mjs unseal _data work/prev
      - name: 수집
        env:
          OPENDART_KEY: ${{ secrets.OPENDART_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          STOOQ_APIKEY: ${{ secrets.STOOQ_APIKEY }}
        run: python -m batch.run kr
      - name: 계산(공용 TS 모듈)
        run: node batch/calc/dist/cli.mjs build-kr work/raw work/prev work/out
      - name: 암호화(D18)
        env: { DATA_KEY: ${{ secrets.DATA_KEY }} }
        run: node batch/calc/dist/cli.mjs seal work/out work/publish
      - uses: actions/upload-artifact@v4
        with: { name: publish, path: work/publish, retention-days: 1, if-no-files-found: error }
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish
      cancel-in-progress: false
      queue: max
    environment: { name: github-pages, url: ${{ steps.deploy.outputs.page_url }} }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with: { name: publish, path: incoming }
      - name: data 브랜치 갱신(자기 모듈 파일만, 실패 시 다시 받아 재시도)
        run: python scripts/publish.py --job daily-kr --incoming incoming --repo-url "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
      - name: 웹앱 빌드
        run: npm run build
      - name: 사이트 묶기(웹앱 + data 브랜치 전체 데이터)
        run: python scripts/assemble_site.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
